aid: kite-hill
name: Kite Hill
description: >-
  Kite Hill is an American plant-based food company founded in 2010 by chef Tal Ronnen,
  cheesemaker Monte Casino and Stanford biochemist Pat Brown, headquartered in Hayward,
  California, making almond-milk yogurts, Greek-style yogurts, cream cheese and sour cream
  alternatives, ricotta, dips and filled pastas sold at Whole Foods, Target, Sprouts, Publix
  and other grocers, and direct to consumers at kite-hill.com. Kite Hill runs no developer
  program and publishes no OpenAPI, but its Shopify-hosted storefront exposes a substantial
  machine-readable surface from its own domain: an anonymously introspectable Storefront
  GraphQL API, TWO live Model Context Protocol servers whose tools/list both answer
  anonymously, a Universal Commerce Protocol merchant profile at /.well-known/ucp, OpenID
  Connect and RFC 8414 discovery for customer accounts, and a provider-authored /agents.md
  and /llms.txt that tell AI agents which surface to use and that no agent may finalize
  payment without contemporaneous human approval.
