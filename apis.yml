apis:
- aid: kite-hill:storefront-graphql
  name: Kite Hill Storefront GraphQL API
  description: >-
    The Shopify Storefront GraphQL API as served from Kite Hill's own domain. Introspection
    is anonymous — the full schema (416 types, 34 query fields, 41 mutations, 28 Relay
    connections) was retrieved without a Storefront access token on 2026-08-23. Covers the
    product catalog, collections, cart and checkout preparation, editorial content, store
    policies and customer accounts.
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://kite-hill.com/api/2026-04/graphql.json
  tags:
  - GraphQL
  - E-Commerce
  - Catalog
  - Cart
  properties:
  - type: GraphQL
    url: graphql/kite-hill-storefront.graphql
  - type: GraphQLManifest
    url: graphql/kite-hill-graphql.yml
  - type: DataModel
    url: data-model/kite-hill-data-model.yml
- aid: kite-hill:storefront-mcp
  name: Kite Hill Storefront MCP Server
  description: >-
    A live Model Context Protocol server on Kite Hill's storefront host. An anonymous
    JSON-RPC tools/list returned five tools with full JSON Schema input contracts —
    search_catalog, get_product_details, get_cart, update_cart and
    search_shop_policies_and_faqs.
  humanURL: https://kite-hill.com/agents.md
  baseURL: https://kite-hill.com/api/mcp
  tags:
  - MCP
  - Agents
  - E-Commerce
  properties:
  - type: MCPServer
    url: mcp/kite-hill-mcp.yml
  - type: ToolCrosswalk
    url: mcp/kite-hill-tool-crosswalk.yml
- aid: kite-hill:ucp-commerce
  name: Kite Hill UCP Agentic Commerce API
  description: >-
    Kite Hill implements the Universal Commerce Protocol for agent-driven commerce. The
    merchant profile at /.well-known/ucp declares UCP 2026-04-08 and 2026-01-23, the
    dev.ucp.shopping MCP service endpoint, the cart / checkout / fulfillment / discount /
    order / catalog capabilities and two payment handlers (Google Pay and Shopify card).
    This endpoint's tools/list answers ANONYMOUSLY — thirteen tools with full JSON Schema
    input contracts, spanning the whole cart-to-completed-order lifecycle. Checkout
    completion still requires contemporaneous buyer approval.
  humanURL: https://ucp.dev/2026-04-08/specification/overview/
  baseURL: https://kite-hill.com/api/ucp/mcp
  tags:
  - UCP
  - Agentic Commerce
  - MCP
  - Checkout
  properties:
  - type: MCPServer
    url: mcp/kite-hill-mcp.yml
  - type: AgenticAccess
    url: agentic-access/kite-hill-agentic-access.yml
