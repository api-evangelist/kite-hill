method: derived
source: >-
  graphql/kite-hill-storefront.graphql + observed JSON-RPC error responses from
  https://kite-hill.com/api/ucp/mcp + observed GraphQL error responses
description: >-
  Kite Hill publishes no error reference of its own and no OpenAPI, so there are no RFC 9457
  problem+json types to derive. This catalog records the error envelopes the surfaces
  ACTUALLY return, captured from the introspected SDL and from errors observed during this
  enrichment run.
format: not-rfc9457
envelopes:
- surface: graphql
  endpoint: https://kite-hill.com/api/2026-04/graphql.json
  transport_status: >-
    200 for request-level errors — the HTTP status does not carry the failure. Errors arrive
    in a top-level errors[] array alongside a null data field.
  fields: [message, locations, path, extensions.code, extensions.documentation, extensions.requiredAccess]
  mutation_errors: >-
    Mutations return typed *UserError lists implementing the DisplayableError interface
    (field, message, code) inside the payload rather than in errors[]. The SDL declares
    CartUserError, CustomerUserError, MetafieldDeleteUserError and friends with their own
    code enums.
- surface: mcp
  endpoints: [https://kite-hill.com/api/ucp/mcp, https://kite-hill.com/api/mcp]
  transport: JSON-RPC 2.0
  fields: [error.code, error.message, error.data.code, error.data.content, error.data.continue_url]
observed:
- surface: mcp
  endpoint: https://kite-hill.com/api/ucp/mcp
  method: resources/list
  http_status: 422
  code: -32001
  message: UCP discovery failed
  data_code: invalid_profile_url
  detail: 'Unable to fetch agent profile: Missing profile uri'
  remediation: >-
    Supply a resolvable UCP agent profile URI. Every tool takes it as
    meta["ucp-agent"]["profile"]; resources/list and prompts/list require it before they will
    answer at all.
  fetched: '2026-08-23'
- surface: mcp
  endpoint: https://kite-hill.com/api/ucp/mcp
  method: prompts/list
  http_status: 422
  code: -32001
  message: UCP discovery failed
  data_code: invalid_profile_url
  fetched: '2026-08-23'
- surface: graphql
  endpoint: https://kite-hill.com/api/2026-04/graphql.json
  http_status: 200
  code: ACCESS_DENIED
  message: 'Access denied for productTags field. Required access: `unauthenticated_read_product_tags` access scope.'
  documentation: https://shopify.dev/api/usage/access-scopes
  remediation: >-
    The anonymous storefront token this endpoint issues does not carry every unauthenticated
    read scope. productTags and productTypes are denied; product, products, collections,
    pages, search and the cart mutations are not.
  fetched: '2026-08-23'
