gaps:
- >-
  No published error reference page. /agents.md and /llms.txt document the happy path and the
  429 back-off rule but no error taxonomy.
- >-
  No RFC 9457 application/problem+json anywhere; neither surface uses HTTP status codes as
  the primary failure channel (GraphQL answers 200; the UCP MCP answers 422 with a JSON-RPC
  error body).
